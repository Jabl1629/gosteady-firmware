# --- GoSteady firmware: ROLLATOR deployment (field) overlay ---
#
# Carries the walker cap's FIELD_MODE deployment posture forward to the
# rollator accessory platform. Apply on top of prj.conf with:
#   west build -b thingy91x/nrf9151/ns -d build_rollator_field -p always -- \
#     -DEXTRA_CONF_FILE=prj_rollator_field.conf \
#        -DCONFIG_AWS_IOT_CLIENT_ID_STATIC='"GS0001000000"'   # per-unit serial
#
# Rollator-product equivalent of prj_field.conf: the FIELD_MODE deployment
# posture (SW0 / uart1 dump / heartbeat + recording LEDs OFF — the device runs
# dark; only the pre-activation blue LED remains) layered over the full cloud /
# PSM / fuel-gauge / forensics / date_time stability stack. This is the
# "mechanisms on, no aggressive battery tuning" baseline that
# prj_rollator_pilot.conf extends with the battery + shipping-mode deltas.
#
# ── ROLLATOR DELTAS vs walker prj_field.conf ──────────────────────────────
#   1. CONFIG_GOSTEADY_PRODUCT_ROLLATOR=y → rol-0.1.0-* version line,
#      heartbeat device_type="rollator_platform", rollator activity payload
#      (active_min required + distance_ft/gait_speed_fts optional, coord §C52).
#   2. Snippets OFF. Walker field ships snippets ON for the v1.5 retrain
#      corpus; the rollator does NOT collect its corpus over the cloud snippet
#      side-channel — DT-2 capture uses full 100 Hz .dat sessions pulled over
#      uart1 on the dedicated capture image (build_rollator_dist). Snippets-off
#      is also load-bearing for RAM: snippets-ON + the gs_rollator_distance
#      filter bank overflows the app image at 0.17.0 (coord §C49).
#
# ⚠ VERSION STRING: this build reports "rol-0.1.0-bench". The version cascade
# (src/version.h) keys the suffix on power-mode only, so the rollator cloud /
# field / capture builds all share "rol-0.1.0-bench". See
# docs/build-configurations.md → "Version-string ambiguity" for the fix.
#
# SELF-CONTAINED (sysbuild forwards only ONE EXTRA_CONF_FILE cleanly — see
# prj_pilot.conf). Mirror discipline: the shared cloud block is duplicated
# across prj_cloud / prj_field / prj_pilot / prj_rollator_cloud / THIS FILE /
# prj_rollator_pilot. The canonical overlay×symbol matrix is
# docs/build-configurations.md — update it whenever this block changes.

# ── Product selection ─────────────────────────────────────────────────────
CONFIG_GOSTEADY_PRODUCT_ROLLATOR=y

# ── Deployment (field) mode ───────────────────────────────────────────────
# Gates off SW0, the uart1 dump channel (and the BLE NUS tunnel that rides on
# it), the idle purple-blink + recording LEDs, and the uart0 heartbeat line.
# Pure motion-driven autonomous capture per M10.5.
CONFIG_GOSTEADY_FIELD_MODE=y

# Project flag: gates src/cloud.c compilation (CMakeLists.txt) AND main.c's
# call to gosteady_cloud_init().
CONFIG_GOSTEADY_CLOUD_ENABLE=y

# ──────────────────────────────────────────────────────────────────────────
# AWS IoT Core MQTT/TLS
# ──────────────────────────────────────────────────────────────────────────
# CONFIG_AWS_IOT_CLIENT_ID_STATIC = MQTT client ID = AWS IoT Thing name =
# device serial. Default is the first rollator bench unit (GS9999999981);
# override per-unit at build time for real deployment serials (rollator
# production block GS0001000000-GS0001999999 per coord §C48.3):
#   -DCONFIG_AWS_IOT_CLIENT_ID_STATIC='"GS0001000000"'
# Cert material at sec_tag 201 (tools/flash_cert.py at bring-up).
CONFIG_AWS_IOT=y
CONFIG_AWS_IOT_CLIENT_ID_STATIC="GS9999999981"
CONFIG_AWS_IOT_BROKER_HOST_NAME="a2dl73jkjzv6h5-ats.iot.us-east-1.amazonaws.com"

# Shadow MQTT subscribe topics (activation re-check contract — Core v1).
# Required for the desired.activated_at re-check on every cellular wake.
CONFIG_AWS_IOT_TOPIC_GET_ACCEPTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_GET_REJECTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_UPDATE_ACCEPTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_UPDATE_REJECTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_UPDATE_DELTA_SUBSCRIBE=y

# CRITICAL: no auto-shadow-get on connect (per-thing policy permits only
# explicit shadow ops; auto-GET causes a silent broker disconnect ~4s after
# CONNECTED — discovered 2026-04-27, see prj_cloud.conf for the full note).
CONFIG_AWS_IOT_AUTO_DEVICE_SHADOW_REQUEST=n

CONFIG_MQTT_HELPER=y
CONFIG_MQTT_HELPER_SEC_TAG=201
CONFIG_MQTT_HELPER_STACK_SIZE=4096
CONFIG_MQTT_KEEPALIVE=1200

# Persistent MQTT session — broker queues QoS 1 cmds (activate/wipe) across
# connect-publish-disconnect wakes (Core Contract v1).
CONFIG_MQTT_CLEAN_SESSION=n

# ──────────────────────────────────────────────────────────────────────────
# Power Saving Mode (PSM) — request at LTE attach (0.12.0 lineage)
# ──────────────────────────────────────────────────────────────────────────
# Modem deep-sleeps (~µA) between hourly heartbeats instead of idling in
# registered I-DRX at mA-level 24/7 — the single largest battery win. Downlink
# (activate/wipe) latency unchanged: cmds arrive at the next connect via the
# cloud connection-coordinator (coord §C24). Validate on uart0: "psm: tau=<s>
# active=<s>". If the carrier denies PSM, fall back to eDRX
# (CONFIG_LTE_EDRX_REQ=y). Full rationale + 3GPP timer decoding in prj_cloud.conf.
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_FORMAT_STRING=y
CONFIG_LTE_PSM_REQ_RPTAU="00010010"
CONFIG_LTE_PSM_REQ_RAT="00000001"

# Networking + sockets — modem TLS offload.
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# ──────────────────────────────────────────────────────────────────────────
# Absolute-time reliability — NCS date_time lib (0.17.0-time; coord §C47)
# ──────────────────────────────────────────────────────────────────────────
# NITZ (%XTIME push) -> NTP/SNTP -> app-set. A no-NITZ roaming SIM falls
# through to SNTP over the data link, fixing the Jun 14-16 2080 mis-dating.
# 12 h refresh ceiling keeps the extra modem wakes negligible for the battery
# budget. (NTP stays default-ON here — unlike the NITZ-only capture image.)
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_UPDATE_INTERVAL_SECONDS=43200
CONFIG_DATE_TIME_TOO_OLD_SECONDS=43200

CONFIG_HEAP_MEM_POOL_SIZE=8192

# ──────────────────────────────────────────────────────────────────────────
# nPM1300 fuel gauge (M10.7.2) — voltage-based OCV SoC (§C43, unconditional)
# ──────────────────────────────────────────────────────────────────────────
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y
CONFIG_REGULATOR=y
CONFIG_I2C=y
CONFIG_SENSOR=y

# ──────────────────────────────────────────────────────────────────────────
# Crash forensics + watchdog (M10.7.3) — required for OTA-less deployment
# ──────────────────────────────────────────────────────────────────────────
CONFIG_GOSTEADY_FORENSICS_ENABLE=y
CONFIG_FLASH_MAP=y

# ──────────────────────────────────────────────────────────────────────────
# Snippet capture — OFF for the rollator (see delta 2 in the header)
# ──────────────────────────────────────────────────────────────────────────
CONFIG_GOSTEADY_SNIPPET_ENABLE=n
