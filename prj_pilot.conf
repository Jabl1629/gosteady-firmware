# --- GoSteady firmware: battery-pilot deployment overlay (self-contained) ---
#
# Apply on top of prj.conf as a single overlay (matches the field/cloud
# pattern — sysbuild only forwards a SINGLE EXTRA_CONF_FILE cleanly to the
# app image; a semicolon-list leaks into the mcuboot sub-image and fails):
#
#   west build -b thingy91x/nrf9151/ns -d build_pilot -p always \
#     -- -DEXTRA_CONF_FILE=prj_pilot.conf \
#        -DCONFIG_AWS_IOT_CLIENT_ID_STATIC='"GS00000000XX"'
#
# Goal: 30-day life on the 1350 mAh AA-class pilot cell.
#
# This is prj_field.conf (FIELD_MODE deployment posture: idle purple-blink /
# SW0 / uart1 dump all OFF; cloud + PSM + fuel gauge + forensics ON) with the
# battery deltas below. NOTE on LEDs: the idle purple blink stays OFF (dark at
# rest), but the green session LED is re-enabled during recording via
# CONFIG_GOSTEADY_SESSION_LED — a deliberate operator-visibility override of
# the M10.5 "dark" posture. Deltas:
#   - Snippets OFF  (no 84 KB per-session opportunistic uploads — the single
#                    largest per-event radio cost; also disables the v1.5
#                    corpus capture, so use prj_field.conf when collecting
#                    corpus rather than optimizing battery).
#   - LOW_POWER ON  (CONFIG_GOSTEADY_LOW_POWER: fuel-gauge cadence 5 s->60 s +
#                    nPM1300 cell current logged on uart0; cellular reporter
#                    poll 60 s->30 min so the modem stays in PSM between
#                    heartbeats).
#
# Deferred (NOT here — pending the bench discharge measurement): idle-sampler
# gating + BMI270 gyro-disable. Both touch the session-capture hot path; the
# set below already clears 30 days with margin per the bench model.
#
# Self-contained bundle: if the shared field/cloud block (PSM, MQTT, fuel
# gauge, forensics) changes, mirror the change here too — same discipline the
# repo already follows between prj_cloud.conf and prj_field.conf.
#
# Builds report firmware "0.13.0-pilot" (src/version.h keys off LOW_POWER).

CONFIG_GOSTEADY_FIELD_MODE=y
CONFIG_GOSTEADY_CLOUD_ENABLE=y

# --- AWS IoT MQTT/TLS (mirror of prj_field.conf) ---
CONFIG_AWS_IOT=y
CONFIG_AWS_IOT_CLIENT_ID_STATIC="GS9999999999"
CONFIG_AWS_IOT_BROKER_HOST_NAME="a2dl73jkjzv6h5-ats.iot.us-east-1.amazonaws.com"
CONFIG_AWS_IOT_TOPIC_GET_ACCEPTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_GET_REJECTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_UPDATE_ACCEPTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_UPDATE_REJECTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_UPDATE_DELTA_SUBSCRIBE=y
CONFIG_AWS_IOT_AUTO_DEVICE_SHADOW_REQUEST=n

CONFIG_MQTT_HELPER=y
CONFIG_MQTT_HELPER_SEC_TAG=201
CONFIG_MQTT_HELPER_STACK_SIZE=4096
CONFIG_MQTT_KEEPALIVE=1200
CONFIG_MQTT_CLEAN_SESSION=n

# --- PSM (mirror of prj_field.conf / prj_cloud.conf; 0.12.0) ---
# Modem deep-sleeps (~µA) between hourly heartbeats. Granted tau=3 h /
# active=2 s on the bench (iBasis). See prj_cloud.conf for the full rationale
# + 3GPP timer-string decoding.
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_FORMAT_STRING=y
CONFIG_LTE_PSM_REQ_RPTAU="00010010"
CONFIG_LTE_PSM_REQ_RAT="00000001"

CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

CONFIG_HEAP_MEM_POOL_SIZE=8192

# --- nPM1300 fuel gauge (mirror of prj_field.conf) ---
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y
CONFIG_REGULATOR=y
CONFIG_I2C=y
CONFIG_SENSOR=y

# --- Crash forensics + watchdog (mirror of prj_field.conf) ---
CONFIG_GOSTEADY_FORENSICS_ENABLE=y
CONFIG_FLASH_MAP=y

# --- Pilot battery deltas (the only differences vs prj_field.conf) ---
CONFIG_GOSTEADY_SNIPPET_ENABLE=n
CONFIG_GOSTEADY_LOW_POWER=y
# Operator visibility: green LED on while recording, dark at rest.
CONFIG_GOSTEADY_SESSION_LED=y
