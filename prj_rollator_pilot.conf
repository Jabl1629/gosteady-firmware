# --- GoSteady firmware: ROLLATOR battery-pilot deployment overlay ---
#
# The rollator accessory platform's battery-optimized shipping posture. Carries
# the walker cap's proven pilot bundle (30-day-target battery work + months-
# long shelf life + operator-visible recording LED) forward to the rollator,
# verbatim — all of it is shared platform code gated by Kconfig, so the
# rollator inherits the mechanisms by construction. Apply on top of prj.conf:
#   west build -b thingy91x/nrf9151/ns -d build_rollator_pilot -p always -- \
#     -DEXTRA_CONF_FILE=prj_rollator_pilot.conf \
#        -DCONFIG_AWS_IOT_CLIENT_ID_STATIC='"GS0001000000"'   # per-unit serial
#
# = prj_rollator_field.conf (FIELD_MODE deployment + cloud/PSM/fuel-gauge/
#   forensics/date_time stability stack, snippets OFF) PLUS the three battery/
#   shipping deltas at the bottom of this file. Mirrors the walker's
#   prj_field.conf -> prj_pilot.conf relationship.
#
# ⚠ VERSION STRING: this build reports "rol-0.1.0-ww" (PREACT_LOWPOWER sets the
#   suffix; see src/version.h). docs/build-configurations.md → "Version-string
#   ambiguity" tracks the disambiguation proposal.
#
# ⚠ MOTION TUNING (DT-3 validation item, spec assumption A3): PREACT_LOWPOWER's
#   shake-to-activate wake window and the auto-start σ-confirmation use the
#   ADXL367 wake-on-motion + BMI270 thresholds tuned for the walker cap's
#   lift-and-place gait. On a rollator (continuous frame vibration from the
#   wheels) they are functionally correct but their SENSITIVITY is unvalidated
#   — a rolling rollator may trip pre-activation wake windows or auto-start
#   more/less readily than intended. Quantify at bench before a real rollator
#   deployment; the mechanism carries forward, the numbers may need a retune.
#
# SELF-CONTAINED (sysbuild forwards only ONE EXTRA_CONF_FILE cleanly). Mirror
# discipline: the shared cloud block is duplicated across prj_cloud /
# prj_field / prj_pilot / prj_rollator_cloud / prj_rollator_field / THIS FILE.
# The canonical overlay×symbol matrix is docs/build-configurations.md — update
# it whenever this block changes.

# ── Product selection ─────────────────────────────────────────────────────
CONFIG_GOSTEADY_PRODUCT_ROLLATOR=y

# ── Deployment (field) mode ───────────────────────────────────────────────
CONFIG_GOSTEADY_FIELD_MODE=y
CONFIG_GOSTEADY_CLOUD_ENABLE=y

# ──────────────────────────────────────────────────────────────────────────
# AWS IoT Core MQTT/TLS
# ──────────────────────────────────────────────────────────────────────────
# Default = first rollator bench unit; override per-unit for real serials
# (rollator production block GS0001000000-GS0001999999, coord §C48.3):
#   -DCONFIG_AWS_IOT_CLIENT_ID_STATIC='"GS0001000000"'
CONFIG_AWS_IOT=y
CONFIG_AWS_IOT_CLIENT_ID_STATIC="GS9999999981"
CONFIG_AWS_IOT_BROKER_HOST_NAME="a2dl73jkjzv6h5-ats.iot.us-east-1.amazonaws.com"

# Shadow MQTT subscribe topics (activation re-check contract — Core v1).
CONFIG_AWS_IOT_TOPIC_GET_ACCEPTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_GET_REJECTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_UPDATE_ACCEPTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_UPDATE_REJECTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_UPDATE_DELTA_SUBSCRIBE=y

# CRITICAL: no auto-shadow-get on connect (silent broker disconnect otherwise —
# see prj_cloud.conf for the full note).
CONFIG_AWS_IOT_AUTO_DEVICE_SHADOW_REQUEST=n

CONFIG_MQTT_HELPER=y
CONFIG_MQTT_HELPER_SEC_TAG=201
CONFIG_MQTT_HELPER_STACK_SIZE=4096
CONFIG_MQTT_KEEPALIVE=1200
CONFIG_MQTT_CLEAN_SESSION=n

# ──────────────────────────────────────────────────────────────────────────
# Power Saving Mode (PSM) — request at LTE attach (0.12.0 lineage)
# ──────────────────────────────────────────────────────────────────────────
# Modem deep-sleeps (~µA) between hourly heartbeats. tau=3h backstop /
# active=2s. Full rationale in prj_cloud.conf. Fall back to eDRX if denied.
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_FORMAT_STRING=y
CONFIG_LTE_PSM_REQ_RPTAU="00010010"
CONFIG_LTE_PSM_REQ_RAT="00000001"

# Networking + sockets — modem TLS offload.
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# ──────────────────────────────────────────────────────────────────────────
# Absolute-time reliability — NCS date_time lib (0.17.0-time; coord §C47)
# ──────────────────────────────────────────────────────────────────────────
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_UPDATE_INTERVAL_SECONDS=43200
CONFIG_DATE_TIME_TOO_OLD_SECONDS=43200

CONFIG_HEAP_MEM_POOL_SIZE=8192

# ──────────────────────────────────────────────────────────────────────────
# nPM1300 fuel gauge (M10.7.2) — voltage-based OCV SoC (§C43, unconditional)
# ──────────────────────────────────────────────────────────────────────────
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y
CONFIG_REGULATOR=y
CONFIG_I2C=y
CONFIG_SENSOR=y

# ──────────────────────────────────────────────────────────────────────────
# Crash forensics + watchdog (M10.7.3)
# ──────────────────────────────────────────────────────────────────────────
CONFIG_GOSTEADY_FORENSICS_ENABLE=y
CONFIG_FLASH_MAP=y

# Snippets OFF (see prj_rollator_field.conf header — RAM + corpus-via-uart1).
CONFIG_GOSTEADY_SNIPPET_ENABLE=n

# ══════════════════════════════════════════════════════════════════════════
# PILOT BATTERY + SHIPPING-MODE DELTAS (vs prj_rollator_field.conf)
# ══════════════════════════════════════════════════════════════════════════
# The walker cap's battery/shelf-life bundle, carried forward. Battery/OCV/
# wipe-floor VALUES still inherit walker defaults until real cupholder hardware
# exists (memo Q3 residual → DT-3).

# LOW_POWER: fuel-gauge worker cadence 5 s -> 60 s + cellular reporter poll
# 60 s -> 30 min, so the modem stays in PSM between hourly heartbeats. (PSM
# itself + snippets-off are set above, not by this flag.)
CONFIG_GOSTEADY_LOW_POWER=y

# SESSION_LED: solid green while recording (operator "motion detected /
# recording" confirmation) even under FIELD_MODE; device still dark at rest.
CONFIG_GOSTEADY_SESSION_LED=y

# PREACT_LOWPOWER: pre-activation shipping mode — a shake opens a blue-pulse
# "wake window" that stays connected trying to collect the activate cmd
# (success → solid green confirm), heartbeat drops to a 24 h safety net, and a
# transit guard backs off after repeated failed windows. Lets a unit ship / sit
# in a box for months on a near-full battery with no pull-tab. Cuts pre-
# activation draw ~340-410 -> ~48 mAh/month. See the ⚠ MOTION TUNING note in
# the header — the wake-on-motion thresholds are walker-tuned.
CONFIG_GOSTEADY_PREACT_LOWPOWER=y
