# --- GoSteady firmware: Family Assistance Alert BENCH overlay (FA-0 / FA-1) ---
#
# Button → speaker harness with a STUB cloud (no MQTT): pressing SW0 runs the
# real 20 s countdown with the DFR0534 prompts and a simulated `assist_ack`.
# Spec: gosteady-portal/docs/specs/family-assistance-alert.md §5 / §9 FA-0.
#
# Build (uart1 is re-pinned to the P1 connector — SB8 + SB9 must be CUT):
#   west build -b thingy91x/nrf9151/ns -d build_assist_bench -p always -- \
#     -DEXTRA_CONF_FILE=prj_assist_bench.conf \
#     -DEXTRA_DTC_OVERLAY_FILE=boards/assist_audio_uart1.overlay
#
# Prompts must be loaded onto the module first: tools/load_dfr0534_prompts.sh

CONFIG_GOSTEADY_ASSIST_ENABLE=y
CONFIG_GOSTEADY_ASSIST_AUDIO=y
CONFIG_GOSTEADY_ASSIST_AUDIO_XPORT_UART1=y
CONFIG_GOSTEADY_ASSIST_AUDIO_VOLUME=20
CONFIG_GOSTEADY_ASSIST_STUB_CLOUD=y
CONFIG_GOSTEADY_ASSIST_AUDIO_SELFTEST=y

# The P0.03 load switch (exp_board_enable) is a regulator-fixed node.
CONFIG_REGULATOR=y

# Keep the bench quiet: no motion auto-start while the device is handled for
# button tests (sessions are irrelevant to this harness).
CONFIG_GOSTEADY_MOTION_AUTOSTART=n

# 0.17.0-time: cellular.c always calls the NCS date_time lib, but only the
# cloud overlays enable it (base prj.conf no longer links — build-configurations.md).
# Modem NITZ source only; no networking in this harness so NTP stays off.
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_NTP=n
CONFIG_HEAP_MEM_POOL_SIZE=8192
