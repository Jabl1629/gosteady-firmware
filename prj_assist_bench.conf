# --- GoSteady firmware: Family Assistance Alert BENCH overlay (FA-0 / FA-1) ---
#
# Button → BUZZER harness with a STUB cloud (no MQTT): pressing SW0 runs the
# real 20 s beep countdown (hold 3 s to cancel) and a simulated `assist_ack`.
# Feedback device: SparkFun Qwiic Buzzer (BOB-24474) on the P1 Qwiic connector.
# Spec: gosteady-portal/docs/specs/family-assistance-alert.md v0.4 §5 / §9 FA-0.
#
# Build — pick the overlay for the board:
#   unmodified board (SB8/SB9 intact, buzzer on i2c2):
#     west build -b thingy91x/nrf9151/ns -d build_assist_bench -p always -- \
#       -DEXTRA_CONF_FILE=prj_assist_bench.conf \
#       -DEXTRA_DTC_OVERLAY_FILE=boards/assist_buzzer_i2c2.overlay
#   the 2026-09-18 bench unit with SB8/SB9 CUT (bit-banged I²C on P0.18/P0.19):
#     west build -b thingy91x/nrf9151/ns -d build_assist_bench_bitbang -p always -- \
#       -DEXTRA_CONF_FILE=prj_assist_bench.conf \
#       -DEXTRA_DTC_OVERLAY_FILE=boards/assist_buzzer_bitbang.overlay

CONFIG_GOSTEADY_ASSIST_ENABLE=y
CONFIG_GOSTEADY_ASSIST_FEEDBACK_BUZZER=y
CONFIG_GOSTEADY_ASSIST_BUZZER_VOLUME=4
CONFIG_GOSTEADY_ASSIST_CANCEL_HOLD_MS=3000
CONFIG_GOSTEADY_ASSIST_STUB_CLOUD=y
CONFIG_GOSTEADY_ASSIST_FEEDBACK_SELFTEST=y

# The P0.03 load switch (exp_board_enable) is a regulator-fixed node.
CONFIG_REGULATOR=y

# Keep the bench quiet: no motion auto-start while the device is handled for
# button tests (sessions are irrelevant to this harness).
CONFIG_GOSTEADY_MOTION_AUTOSTART=n

# 0.17.0-time: cellular.c always calls the NCS date_time lib, but only the
# cloud overlays enable it (base prj.conf no longer links — build-configurations.md).
# Modem NITZ source only; no networking in this harness so NTP stays off.
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_NTP=n
CONFIG_HEAP_MEM_POOL_SIZE=8192
