# --- GoSteady firmware: ROLLATOR bench + cloud (AWS IoT MQTT/TLS) overlay ---
#
# Phase DT-1 (portal spec phase-dt1-rollator-bench-bringup.md, coord §C49).
# Apply on top of prj.conf with:
#   west build -b thingy91x/nrf9151/ns -d build_rollator_gs81 -- \
#     -DEXTRA_CONF_FILE=prj_rollator_cloud.conf
#
# Rollator-product equivalent of prj_cloud.conf: bench posture (SW0, uart1
# dump, capture tooling, BLE, LEDs all intact) + the cloud path, with the
# product switched to the rollator accessory platform. Product effects:
#   - firmware version line rol-0.1.0-bench (src/version.h)
#   - heartbeat device_type = "rollator_platform" (cloud cross-checks vs
#     Device Registry, alarms on mismatch — DT-0)
#   - activity uplink = bench-v0 contract: active_min + Core envelope ONLY
#     (no steps/distance_ft/roughness/surface/gait — memo D10)
#   - bench/field prewalk hardware defaults: rollator_4wheel / frame_mount /
#     accessory_platform (src/main.c)
#
# SELF-CONTAINED COPY of prj_cloud.conf's cloud block (sysbuild forwards only
# ONE EXTRA_CONF_FILE cleanly — see prj_pilot.conf:3-5). Mirror discipline:
# prj_cloud.conf <-> prj_field.conf <-> prj_pilot.conf <-> THIS FILE. If you
# change the shared cloud block in any of them, mirror the others.

# ── Product selection (DT-1) ──────────────────────────────────────────
CONFIG_GOSTEADY_PRODUCT_ROLLATOR=y

# Project flag: gates src/cloud.c compilation (see CMakeLists.txt) AND
# main.c's call to gosteady_cloud_init().
CONFIG_GOSTEADY_CLOUD_ENABLE=y

# ──────────────────────────────────────────────────────────────────────
# AWS IoT Core MQTT/TLS
# ──────────────────────────────────────────────────────────────────────
# CONFIG_AWS_IOT_CLIENT_ID_STATIC = MQTT client ID = AWS IoT Thing name =
# device serial. Default here is the FIRST ROLLATOR BENCH UNIT
# (GS9999999981, dev block GS9999999980-89 per coord §C48.3; …80 is a
# cloud-smoke fixture, never a physical unit). Per-unit override:
#   -DCONFIG_AWS_IOT_CLIENT_ID_STATIC='"GS99999999xx"'
# Cert material at sec_tag 201 (tools/flash_cert.py at bring-up).
CONFIG_AWS_IOT=y
CONFIG_AWS_IOT_CLIENT_ID_STATIC="GS9999999981"
CONFIG_AWS_IOT_BROKER_HOST_NAME="a2dl73jkjzv6h5-ats.iot.us-east-1.amazonaws.com"

# Shadow MQTT subscribe topics (activation re-check contract — Core v1).
CONFIG_AWS_IOT_TOPIC_GET_ACCEPTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_GET_REJECTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_UPDATE_ACCEPTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_UPDATE_REJECTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_UPDATE_DELTA_SUBSCRIBE=y

# CRITICAL: no auto-shadow-get on connect (per-thing policy permits only
# explicit shadow ops; auto-GET causes silent broker disconnect ~4s after
# CONNECTED — discovered 2026-04-27, see prj_cloud.conf for full note).
CONFIG_AWS_IOT_AUTO_DEVICE_SHADOW_REQUEST=n

# Bench overlay: surface aws_iot lib internals on uart0 (matches prj_cloud).
CONFIG_AWS_IOT_LOG_LEVEL_DBG=y

CONFIG_MQTT_HELPER=y
CONFIG_MQTT_HELPER_SEC_TAG=201
CONFIG_MQTT_HELPER_STACK_SIZE=4096
CONFIG_MQTT_KEEPALIVE=1200

# Persistent MQTT session — broker queues QoS 1 cmds (activate/wipe)
# across connect-publish-disconnect wakes (Core Contract v1).
CONFIG_MQTT_CLEAN_SESSION=n

# ──────────────────────────────────────────────────────────────────────
# Power Saving Mode (PSM) — request at LTE attach (0.12.0 lineage)
# ──────────────────────────────────────────────────────────────────────
# Full rationale in prj_cloud.conf. tau=3h backstop / active=2s.
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_FORMAT_STRING=y
CONFIG_LTE_PSM_REQ_RPTAU="00010010"
CONFIG_LTE_PSM_REQ_RAT="00000001"

# Networking + sockets — modem TLS offload.
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# ──────────────────────────────────────────────────────────────────────
# Absolute-time reliability — NCS date_time lib (0.17.0-time; coord §C47)
# ──────────────────────────────────────────────────────────────────────
# NITZ -> NTP -> app-set; full rationale in prj_cloud.conf.
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_UPDATE_INTERVAL_SECONDS=43200
CONFIG_DATE_TIME_TOO_OLD_SECONDS=43200

# Heap headroom for mbedTLS handshake + MQTT helper buffers.
CONFIG_HEAP_MEM_POOL_SIZE=8192

# ──────────────────────────────────────────────────────────────────────
# nPM1300 fuel gauge (M10.7.2) — voltage-based OCV SoC as of §C43
# ──────────────────────────────────────────────────────────────────────
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y
CONFIG_REGULATOR=y
CONFIG_I2C=y
CONFIG_SENSOR=y

# ──────────────────────────────────────────────────────────────────────
# Crash forensics + watchdog (M10.7.3)
# ──────────────────────────────────────────────────────────────────────
CONFIG_GOSTEADY_FORENSICS_ENABLE=y
CONFIG_FLASH_MAP=y

# ──────────────────────────────────────────────────────────────────────
# M12.1f snippet capture — OFF for the rollator bench image (DT-1)
# ──────────────────────────────────────────────────────────────────────
# Two reasons, both load-bearing:
#  1. RAM: as of 0.17.0 the full prj_cloud config (snippets ON +
#     AWS_IOT_LOG_LEVEL_DBG) no longer links — RAM overflows by 1296 B
#     (pre-existing on walker prj_cloud too, discovered at DT-1 bring-up;
#     coord §C49. Recent units all shipped the prj_pilot/wakewindow
#     config where snippets are already OFF, which is why nobody hit it.)
#  2. SIM budget: the bench unit runs the Nordic-shipped iBasis eSIM
#     (10 MB LIFETIME); snippets dominate ~300x heartbeats per the
#     bring-up playbook sizing table and would exhaust it in days.
# DT-2 data collection does NOT need snippets: the capture path is full
# 100 Hz .dat sessions pulled over uart1 (pull_sessions.py) — strictly
# more data than the first-30s cloud snippet side-channel.
CONFIG_GOSTEADY_SNIPPET_ENABLE=n
